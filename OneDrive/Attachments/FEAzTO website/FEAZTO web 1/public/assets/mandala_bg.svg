    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(45)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(225)"/>
    <ellipse cx="0" cy="-45" rx="8" ry="15" fill="rgba(180,100,0,0.35)" transform="rotate(270)"/>
