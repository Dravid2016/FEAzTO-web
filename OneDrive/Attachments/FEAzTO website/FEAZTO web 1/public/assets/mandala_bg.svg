    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(45)"/>
