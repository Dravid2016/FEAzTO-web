    <ellipse cx="0" cy="-128" rx="16" ry="30" fill="rgba(180,100,0,0.38)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-128" rx="16" ry="30" fill="rgba(180,100,0,0.38)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-128" rx="16" ry="30" fill="rgba(180,100,0,0.38)" transform="rotate(225)"/>
    <ellipse cx="0" cy="-128" rx="16" ry="30" fill="rgba(180,100,0,0.38)" transform="rotate(270)"/>
