<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="40%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </radialGradient>
    <radialGradient id="mandalaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="60%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#E08000"/>
    </radialGradient>
    <!-- Subtle mandala pattern overlay -->
    <pattern id="mandalaTile" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="90" cy="90" r="70" fill="none" stroke="rgba(255,180,0,0.25)" stroke-width="1"/>
      <circle cx="90" cy="90" r="55" fill="none" stroke="rgba(255,180,0,0.2)" stroke-width="1"/>
      <circle cx="90" cy="90" r="40" fill="none" stroke="rgba(255,180,0,0.2)" stroke-width="1"/>
      <circle cx="90" cy="90" r="25" fill="none" stroke="rgba(255,180,0,0.2)" stroke-width="1"/>
      <!-- Petals 1 -->
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(0 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(30 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(60 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(90 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(120 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(150 90 90)"/>
