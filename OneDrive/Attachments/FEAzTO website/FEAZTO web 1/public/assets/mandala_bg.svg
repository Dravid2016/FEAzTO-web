    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(30)"/>
    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(150)"/>
    <ellipse cx="0" cy="-72" rx="12" ry="22" fill="rgba(180,100,0,0.42)" transform="rotate(180)"/>
