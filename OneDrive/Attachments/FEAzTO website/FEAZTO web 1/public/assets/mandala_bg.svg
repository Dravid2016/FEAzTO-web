    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(45)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(225)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-60" rx="10" ry="20" fill="rgba(180,100,0,0.4)" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="35" fill="rgba(255,210,30,0.2)" stroke="rgba(200,120,0,0.4)" stroke-width="1.5"/>
