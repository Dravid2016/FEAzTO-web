    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(157.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(225)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(247.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(292.5)"/>
    <ellipse cx="0" cy="-260" rx="22" ry="45" fill="rgba(200,120,0,0.35)" transform="rotate(315)"/>
