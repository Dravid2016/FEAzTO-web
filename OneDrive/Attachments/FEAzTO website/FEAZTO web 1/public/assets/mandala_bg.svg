      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(210 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(240 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(270 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(300 90 90)"/>
      <ellipse cx="90" cy="30" rx="8" ry="16" fill="rgba(255,180,0,0.2)" transform="rotate(330 90 90)"/>
      <!-- Inner petals -->
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(0 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(45 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(90 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(135 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(180 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(225 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(270 90 90)"/>
      <ellipse cx="90" cy="55" rx="5" ry="10" fill="rgba(200,130,0,0.18)" transform="rotate(315 90 90)"/>
